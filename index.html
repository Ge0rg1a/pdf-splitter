<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>PDF 分割工具</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>PDF 分割工具</h1>

    <div class="card">
      <div class="row">
        <button id="btnSelect">选择 PDF 文件</button>
        <span id="fileInfo" class="file-info">未选择文件</span>
      </div>
      <div id="pageInfo" class="page-info"></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-mode="split">分割:每 N 页一份</button>
      <button class="tab" data-mode="remove">删除:移除指定页</button>
    </div>

    <div id="splitPanel" class="panel">
      <label>每
        <input type="number" id="n" min="1" value="1" class="small-input">
        页生成一个文件
      </label>
      <p class="hint">例如输入 2,则第1-2页、第3-4页…各成一个文件</p>
    </div>

    <div id="removePanel" class="panel hidden">
      <label>从第
        <input type="number" id="start" min="1" value="1" class="small-input">
        页 到 第
        <input type="number" id="end" min="1" value="1" class="small-input">
        页 删除
      </label>
      <p class="hint">输入要删除的起止页码(含两端),其余页保留输出</p>
    </div>

    <button id="btnRun" class="run-btn" disabled>开始处理</button>

    <div id="result" class="result"></div>
    <button id="btnOpenDir" class="open-dir-btn hidden">打开输出文件夹</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
